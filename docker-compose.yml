services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./share/init.sql:/docker-entrypoint-initdb.d/init.sql
      - .datastore/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks: [coins-network]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # panel WWW
    volumes:
      - .datastore/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    networks: [coins-network]

  # jednorazowo tworzy bucket i ustawia go jako PRYWATNY (decyzja D3)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/coin-master &&
      mc anonymous set none local/coin-master
      "
    networks: [coins-network]

  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    command: dev
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://coins:password@db:5432/coins"
      AWS_ENDPOINT_URL: "http://minio:9000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    networks: [coins-network]

networks:
  coins-network:
    name: coins-network
