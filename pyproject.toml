[project]
name = "coin-master"
version = "1.0.0"
description = ""
authors = [{ name = "Wioletta Wajda", email = "wioletta.wajda@devsoft.pl" }]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.4,<0.116",
    "pydantic>=2.9.2,<3",
    "python-dotenv>=1.0.0,<2",
    "uvicorn[standard]>=0.32.0,<0.33",
    "alembic>=1.8.0,<2",
    "sqlalchemy[mypy]>=2.0.36,<3",
    "pydantic-settings>=2.6.1,<3",
    "asyncpg>=0.30.0,<0.31",
    "alembic-postgresql-enum>=1.1.2,<2",
    "anyio>=4.6.2,<5",
    "email-validator>=2.1.1,<3",
    "python-multipart>=0.0.17,<0.0.18",
    "pillow>=11.0.0,<12",
    "boto3>=1.35.55,<2",
    "pydantic-extra-types>=2.10.0,<3",
    "dependency-injector==4.43.0",
    "sentry-sdk[asyncpg,celery,fastapi,sqlalchemy,starlette]>=2.18.0,<3",
    "fastapi-mail>=1.4.1,<2",
    "pwdlib[argon2]>=0.2.1,<0.3",
    "asyncclick>=8.1.7.2,<9",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0,<0.21",
    "black>=24.3.0,<25",
    "boto3-stubs[essential]>=1.34.145,<2",
    "coverage>=7.5.1,<8",
    "factory-boy>=3.3.0,<4",
    "flake8==7.1.1",
    "httpx>=0.27.0,<0.28",
    "isort>=5.12.0,<6",
    "mypy>=1.4.1,<2",
    "pre-commit>=3.3.3,<4",
    "pytest>=8.1.1,<9",
    "pytest-asyncio>=0.23.6,<0.24",
    "pytest-cov>=4.1.0,<5",
    "pytest-env>=1.1.3,<2",
    "types-passlib>=1.7.7.20240327,<2",
    "pytest-timeout>=2.3.1,<3",
    "flake8-bugbear>=24.8.19,<25",
    "flake8-comprehensions>=3.15.0,<4",
    "flake8-simplify>=0.21.0,<0.22",
]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = [
    "app/",
    "tests/",
]
env = [
    "RUN_ENV=test",
]
timeout = 15
# --cov=app/ --cov-report=term-missing --cov-report=html --cov-report=xml  --cov-fail-under=100 --durations=10
addopts = "--no-header -v --new-first --showlocals"
testpaths = ["tests", "tests/integrations"]
norecursedirs = [
    ".git",
    ".cache",
    "tmp*",
]

asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "app/db/migrations/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 120
exclude = '''

(
  /(
    | \.git
    | \.venv
    | migrations
    | \.env
  )/
)
'''

[tool.isort]
line_length = 120
multi_line_output = 3
force_grid_wrap = 2
indent = 4
use_parentheses = true
include_trailing_comma = true
lines_after_imports = 2
combine_as_imports = true
sections = "FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER"
skip = [".git", ".venv", "migrations", ".env"]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
mypy_path = "app"
python_version = "3.12"
#strict = true
exclude = [
    "app/infrastructure/migrations/*",
    "\\.venv/",
]

[[tool.mypy.overrides]]
module = "factory"
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version}"
tag_format = "v{version}"
commit_author = "github-actions <action@devsoft.pl>"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false
prerelease_token = "beta"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "revert"]
minor_tags = ["feat"]
patch_tags = ["build", "chore", "ci", "fix", "perf", "style", "refactor", "revert"]

[tool.semantic_release.changelog]
template_dir = "semantic_template"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = ["build", "chore", "ci", "docs", "perf", "refactor", "revert", "style"]

[tool.semantic_release.remote]
name = "origin"
type = "github"