---
name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Testy jednostkowe/integracyjne używają FakeS3StorageRepository (bez sieci,
      # bez Dockera) — patrz tests/conftest.py::storage. MinIO nie jest tu potrzebne.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # check-out repo
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install poetry dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: |
          poetry run black --check .
          poetry run flake8 .
          poetry run isort --check-only .

      - name: Mypy
        continue-on-error: true
        run: poetry run mypy .

      - name: Pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/postgres"
        run: poetry run pytest --cov=app --cov-report=term-missing


  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install poetry dependencies
        run: pip install python-semantic-release

      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Set git details
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@devsoft.pl"

          # run semantic-release
          semantic-release version
          semantic-release publish